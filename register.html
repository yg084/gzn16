<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册 · 梗指北</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<!-- data-page 告诉 main.js：当前是注册页 -->
<body data-page="register">

  <!-- ============================ 顶部导航 ============================ -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="index.html">
        <span class="logo__dot"></span>
        梗指北
      </a>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>

  <main class="container">
    <!-- ============================ 注册表单 ============================ -->
    <form class="form-card" id="registerForm" novalidate>
      <h1 class="page-title" style="margin-top:0">用户注册</h1>
      <p class="page-desc">注册一个普通用户账号，即可登录并参与评论。</p>

      <div class="form-msg" id="formMsg"></div>

      <div class="form-item">
        <label class="form-label" for="username">用户名<span class="required">*</span></label>
        <input class="input" id="username" name="username" type="text" placeholder="2-16 位，字母/数字/下划线/中文"
          autocomplete="username" required />
        <p class="form-hint">用户名不可重复，且不能使用管理员保留名 yg。</p>
      </div>

      <div class="form-item">
        <label class="form-label" for="realname">真实姓名<span class="required">*</span></label>
        <input class="input" id="realname" name="realname" type="text" placeholder="2-20 个字，用于身份识别"
          autocomplete="name" required />
        <p class="form-hint">真实姓名平时不会显示，只有进入你的个人主页或管理后台才能看到。</p>
      </div>

      <div class="form-item">
        <label class="form-label" for="password">密码<span class="required">*</span></label>
        <input class="input" id="password" name="password" type="password" placeholder="至少 6 位" autocomplete="new-password"
          required />
      </div>

      <div class="form-item">
        <label class="form-label" for="password2">确认密码<span class="required">*</span></label>
        <input class="input" id="password2" name="password2" type="password" placeholder="请再次输入密码"
          autocomplete="new-password" required />
      </div>

      <button class="btn btn--primary btn--block" type="submit">注册并登录</button>

      <div class="form-footer">
        已有账号？<a href="login.html">去登录</a>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    梗指北 · 纯前端实现 · 数据保存在浏览器 localStorage
  </footer>

  <div class="toast" id="toast"></div>

  <script src="js/main.js" defer></script>
</body>

</html>
