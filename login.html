<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 梗指北</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<!-- data-page 告诉 main.js：当前是登录页 -->
<body data-page="login">

  <!-- ============================ 顶部导航 ============================ -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="index.html">
        <span class="logo__dot"></span>
        梗指北
      </a>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>

  <main class="container">
    <!-- ============================ 登录表单 ============================ -->
    <form class="form-card" id="loginForm" autocomplete="on" novalidate>
      <h1 class="page-title" style="margin-top:0">用户登录</h1>
      <p class="page-desc">登录后即可发布博客、发表评论。</p>

      <!-- 错误/成功提示条 -->
      <div class="form-msg" id="formMsg"></div>

      <div class="form-item">
        <label class="form-label" for="username">用户名<span class="required">*</span></label>
        <input class="input" id="username" name="username" type="text" placeholder="请输入用户名" autocomplete="username"
          required />
      </div>

      <div class="form-item">
        <label class="form-label" for="password">密码<span class="required">*</span></label>
        <input class="input" id="password" name="password" type="password" placeholder="请输入密码"
          autocomplete="current-password" required />
      </div>

      <button class="btn btn--primary btn--block" type="submit">登 录</button>

      <div class="form-footer">
        还没有账号？<a href="register.html">立即注册</a>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    梗指北 · 纯前端实现 · 数据保存在浏览器 localStorage
  </footer>

  <div class="toast" id="toast"></div>

  <script src="js/main.js" defer></script>
</body>

</html>
